<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Kaizen AI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
  <script src="theme.js"></script>
</head>
<body>

  <nav>
    <div class="nav-left">
      <img src="images/Kaizenlogo.png" alt="Kaizen" class="nav-logo" />
      <span class="nav-brand">Kaizen AI</span>
    </div>
    <div class="nav-links">
      <a href="/dashboard.html" class="active">Dashboard</a>
      <a href="/activity.html">Activity</a>
      <a href="/graphs.html">Graphs</a>
      <a href="/history.html">History</a>
      <a href="/ai.html">AI</a>
      <a href="/pomodoro.html">Pomodoro</a>
      <a href="/ambient.html">Ambient</a>
      <a href="/profile.html">Profile</a>
    </div>
    <div class="nav-right">
      <button id="themeBtn" onclick="toggleTheme()" class="theme-btn">🌙 Dark</button>
      <div class="streak-wrap">
        <span id="streak-info">Streak: <strong id="streak">-</strong></span>
        <div id="fireWrap" class="fire-wrap hidden">
          <img src="images/fire.png" alt="fire" class="fire-img" />
        </div>
      </div>
      <div class="user-avatar" id="userAvatar">👤</div>
      <span id="userInfo" class="user-name"></span>
      <button onclick="signOut()" class="pixel-btn">Sign Out</button>
    </div>
  </nav>


  <div class="hero-row">
    <span class="mascot" id="mascotLeft">🤖</span>
    <div>
      <h2 id="greeting" class="pixel-heading">Hello! 👋</h2>
      <p>Ready to improve today?</p>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="dashboard-layout">
    <div class="main-content">

      <!-- QUICK ACCESS -->
      <div class="section">
        <h3 class="pixel-heading sm">Quick Access</h3>
        <div class="quick-grid">
          <button class="quick-btn" onclick="location.href='/activity.html'">➕<span>Add Habit</span></button>
          <button class="quick-btn" onclick="location.href='/pomodoro.html'">⏱<span>Focus</span></button>
          <button class="quick-btn" onclick="location.href='/ai.html'">🤖<span>AI</span></button>
          <button class="quick-btn" onclick="location.href='/graphs.html'">📊<span>Analytics</span></button>
          <button class="quick-btn" onclick="location.href='/ambient.html'">🌙<span>Ambient</span></button>
          <button class="quick-btn" onclick="location.href='/profile.html'">👤<span>Profile</span></button>
        </div>
      </div>

      <!-- HP / PROGRESS BAR -->
      <div class="section">
        <h3 class="pixel-heading sm">Today's Progress</h3>
        <div class="hp-bar-wrap">
         <div class="hp-bar-wrap">
          <div class="hp-bar-outer">
            <img src="images/heart.png" class="hp-heart" alt="hp" />
            <div class="hp-bar-inner" id="hpBarInner" style="width: 0%"></div>
            <span class="hp-label" id="hpLabel">0%</span>
          </div>
        </div>
        </div>
        <div id="progressDots" class="section">Loading…</div>
      </div>

      <!-- CHARTS -->
      <div class="section grid2">
        <div class="card">
          <h3 class="pixel-heading sm">Time Distribution</h3>
          <canvas id="pieChart" width="250" height="250"></canvas>
        </div>
        <div class="card">
          <h3 class="pixel-heading sm">Motivation</h3>
          <blockquote id="quote">Small daily improvements lead to massive results.</blockquote>
          <p><em>– Kaizen Philosophy</em></p>
          <hr/>
          <h4 class="pixel-heading sm">Weekly Productivity</h4>
          <canvas id="barChart" width="250" height="200"></canvas>
        </div>
      </div>

    </div>

    <!-- MASCOT PANEL -->
    <div class="mascot-panel">
      <div class="mascot-emotion-wrap">
        <img id="emotionMascot" src="images/mascot-tired.png" alt="mascot" class="mascot-emotion-img" />
        <p id="emotionLabel" class="emotion-label">Loading…</p>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="mascot.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
